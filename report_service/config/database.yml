default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "password123" } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "db_report" } %>

development:
  <<: *default
  database: report_service_development

test:
  <<: *default
  database: report_service_test
  host: db-report
