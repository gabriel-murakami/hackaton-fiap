default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "password123" } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "db_upload" } %>

development:
  <<: *default
  database: upload_service_development

test:
  <<: *default
  database: upload_service_test
